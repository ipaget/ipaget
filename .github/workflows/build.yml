name: build

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Non-interactive CI environment
  CI: true

jobs:
  windows:
    name: ${{ matrix.artifact }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            artifact: windows-x64
          - target: i686-pc-windows-msvc
            artifact: windows-x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Initialize Go device library
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init go-service/vendors/go-ios

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go-service/go.sum

      - name: Build frontend (vite)
        run: pnpm run build

      - name: Build Go service (PS)
        shell: pwsh
        run: |
          cd go-service
          ./build.ps1

      - name: Build Tauri (msi+nsis)
        run: |
          pnpm tauri build --bundles msi,nsis --target ${{ matrix.target }} --ci

      - name: Install UPX
        shell: pwsh
        run: |
          choco install upx -y

      - name: Compress portable exe with UPX
        shell: pwsh
        run: |
          Get-ChildItem "src-tauri/target/${{ matrix.target }}/release/*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "Compressing $_" -ForegroundColor Cyan
            upx -9 "$_"
          }

      - name: Collect release artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $release = "src-tauri/target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force release-dist | Out-Null

          $app = Get-ChildItem "$release/*.exe" | Select-Object -First 1
          $msi = Get-ChildItem "$release/bundle/msi/*.msi" | Select-Object -First 1
          $setup = Get-ChildItem "$release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $app -or -not $msi -or -not $setup) {
            throw "Missing bundle output under $release"
          }

          Copy-Item $app.FullName "release-dist/iPAGet_${version}_${{ matrix.artifact }}-portable.exe"
          Copy-Item $msi.FullName "release-dist/iPAGet_${version}_${{ matrix.artifact }}.msi"
          Copy-Item $setup.FullName "release-dist/iPAGet_${version}_${{ matrix.artifact }}-setup.exe"
          Get-ChildItem release-dist | Select-Object Name, Length

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release-dist/*
          if-no-files-found: error

  linux-amd64:
    name: linux-amd64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system deps for Tauri bundling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            librsvg2-dev \
            desktop-file-utils \
            appstream \
            libpipewire-0.3-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxrandr-dev \
            libgbm-dev \
            libdrm-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config
          # Only needed to run AppImages; avoids replacing the runner's fuse3.
          sudo apt-get install -y libfuse2t64 || echo 'libfuse2 unavailable, continuing'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize Go device library
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init go-service/vendors/go-ios

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go-service/go.sum

      - name: Build frontend (vite)
        run: pnpm run build

      - name: Build Go service (bash)
        run: |
          cd go-service
          bash build.sh

      - name: Build Tauri (appimage)
        run: |
          pnpm tauri build --bundles appimage --ci

      - name: Collect release artifacts
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APPIMAGE=$(find src-tauri/target/release/bundle/appimage -name '*.AppImage' -print -quit)
          if [ -z "$APPIMAGE" ]; then echo 'no AppImage produced' >&2; exit 1; fi
          mkdir -p release-dist
          cp "$APPIMAGE" "release-dist/iPAGet_${VERSION}_linux-amd64.AppImage"
          cp src-tauri/target/release/ipaget "release-dist/iPAGet_${VERSION}_linux-amd64-portable"
          ls -l release-dist

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: release-dist/*
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust (aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Initialize Go device library
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init go-service/vendors/go-ios

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go-service/go.sum

      - name: Build frontend (vite)
        run: pnpm run build

      - name: Build Go service (bash)
        run: |
          cd go-service
          bash build.sh

      - name: Build Tauri (app)
        run: |
          pnpm tauri build --bundles app --target aarch64-apple-darwin --ci

      - name: Zip .app for upload
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_DIR=$(find src-tauri/target -type d -path '*/bundle/macos/*.app' | head -n 1)
          if [ -z "$APP_DIR" ]; then echo 'no .app bundle produced' >&2; exit 1; fi
          mkdir -p release-dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "release-dist/iPAGet_${VERSION}_macos-arm64.app.zip"

      - name: Upload .app zip for the universal build
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-app
          path: release-dist/*
          if-no-files-found: error

  macos-x64:
    name: macos-x64
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust (x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Initialize Go device library
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init go-service/vendors/go-ios

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: go-service/go.sum

      - name: Build frontend (vite)
        run: pnpm run build

      - name: Build Go service (bash)
        run: |
          cd go-service
          bash build.sh

      - name: Build Tauri (app)
        run: |
          pnpm tauri build --bundles app --target x86_64-apple-darwin --ci

      - name: Zip .app for upload
        run: |
          VERSION=$(node -p "require('./package.json').version")
          APP_DIR=$(find src-tauri/target -type d -path '*/bundle/macos/*.app' | head -n 1)
          if [ -z "$APP_DIR" ]; then echo 'no .app bundle produced' >&2; exit 1; fi
          mkdir -p release-dist
          ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" "release-dist/iPAGet_${VERSION}_macos-x64.app.zip"

      - name: Upload .app zip for the universal build
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-app
          path: release-dist/*
          if-no-files-found: error

  macos-universal:
    name: macos-universal
    runs-on: macos-15-intel
    needs: [macos-arm64, macos-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download macOS arm64 APP
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-app
          path: artifacts/macos-arm64

      - name: Download macOS x64 APP
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-app
          path: artifacts/macos-x64

      - name: Unzip apps
        run: |
          df -h /
          mkdir -p work
          unzip -q artifacts/macos-arm64/*.zip -d work/arm64
          unzip -q artifacts/macos-x64/*.zip -d work/x64
          rm -f artifacts/macos-arm64/*.zip artifacts/macos-x64/*.zip

      - name: Create Universal .app and DMG
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-dist
          ARM_APP=$(ls -d work/arm64/*.app | head -n 1)
          X64_APP=$(ls -d work/x64/*.app | head -n 1)
          [ -z "$ARM_APP" -o -z "$X64_APP" ] && echo "Apps not found" && exit 1
          ditto "$ARM_APP" work/universal.app
          BIN_NAME=$(basename "$(ls work/universal.app/Contents/MacOS/* | head -n 1)")
          lipo -create \
            "$ARM_APP/Contents/MacOS/$BIN_NAME" \
            "$X64_APP/Contents/MacOS/$BIN_NAME" \
            -output work/universal.app/Contents/MacOS/$BIN_NAME
          chmod +x work/universal.app/Contents/MacOS/$BIN_NAME
          GO_REL=Contents/Resources/binaries/ipaget-service
          if [ -f "$ARM_APP/$GO_REL" ] && [ -f "$X64_APP/$GO_REL" ]; then
            lipo -create "$ARM_APP/$GO_REL" "$X64_APP/$GO_REL" -output work/universal.app/$GO_REL
            chmod +x work/universal.app/$GO_REL
          fi
          # Free the per-architecture copies before hdiutil needs working space.
          rm -rf work/arm64 work/x64
          df -h /
          if ! hdiutil create -volname iPAGet -srcfolder work/universal.app -ov -format UDZO "release-dist/iPAGet_${VERSION}_macos-universal.dmg"; then
            echo 'disk image creation failed, publishing a zip of the universal app instead'
            ditto -c -k --sequesterRsrc --keepParent work/universal.app "release-dist/iPAGet_${VERSION}_macos-universal.app.zip"
          fi
          rm -rf work
          df -h /

      - name: Upload universal macOS build
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-universal
          path: release-dist/*
          if-no-files-found: error

  release:
    name: release-draft
    runs-on: ubuntu-latest
    needs: [windows, linux-amd64, macos-arm64, macos-x64, macos-universal]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The changelog walks the tag range, so the job needs the full history.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist-release

      - name: List downloaded artifacts
        run: |
          echo "Downloaded files:" && ls -l dist-release

      - name: Verify tag matches the app version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version $APP_VERSION" >&2
            exit 1
          fi

      - name: Generate release notes
        run: |
          node scripts/release-notes.mjs \
            --tag "$GITHUB_REF_NAME" \
            --assets dist-release \
            --output release-body.md

      - name: Create GitHub Release (draft) and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            dist-release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


