name: build

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  # Non-interactive CI environment
  CI: true

jobs:
  windows:
    name: windows-${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build frontend (vite)
        run: pnpm run build

      - name: Build Go service (PS)
        shell: pwsh
        run: |
          cd go-service
          ./build.ps1

      - name: Build Tauri (app+msi+nsis)
        run: |
          pnpm tauri build -- --bundles app,msi,nsis --target ${{ matrix.target }} --ci

      - name: Install UPX
        shell: pwsh
        run: |
          choco install upx -y

      - name: Compress portable exe with UPX
        shell: pwsh
        run: |
          Get-ChildItem "src-tauri/target/**/bundle/app/*.exe" -Recurse | ForEach-Object {
            Write-Host "Compressing $_" -ForegroundColor Cyan
            upx -9 "$_"
          }

      - name: Upload artifacts (app exe)
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-app
          path: |
            src-tauri/target/**/bundle/app/*.exe
          if-no-files-found: ignore

      - name: Upload artifacts (msi)
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-msi
          path: |
            src-tauri/target/**/bundle/msi/*.msi
          if-no-files-found: ignore

      - name: Upload artifacts (nsis)
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.target }}-nsis
          path: |
            src-tauri/target/**/bundle/nsis/*.exe
          if-no-files-found: ignore

  linux-amd64:
    name: linux-amd64
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install system deps for Tauri bundling
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            librsvg2-dev \
            desktop-file-utils \
            appstream \
            fuse

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build frontend (vite)
        run: pnpm run build

      - name: Patch tauri.conf.json beforeBuildCommand to use build.sh
        run: |
          jq '.build.beforeBuildCommand = "npm run build && cd go-service && bash build.sh"' src-tauri/tauri.conf.json > src-tauri/tauri.ci.conf.json

      - name: Build Go service (bash)
        run: |
          cd go-service
          bash build.sh

      - name: Build Tauri (app+appimage)
        env:
          TAURI_CONFIG: ${{ github.workspace }}/src-tauri/tauri.ci.conf.json
        run: |
          pnpm tauri build -- --bundles app,appimage --ci

      - name: Upload artifacts (AppImage)
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-appimage
          path: |
            src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: ignore

      - name: Upload artifacts (app binary)
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-app
          path: |
            src-tauri/target/**/bundle/app/*
          if-no-files-found: ignore

  macos-arm64:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust (aarch64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build frontend (vite)
        run: pnpm run build

      - name: Patch tauri.conf.json beforeBuildCommand to use build.sh
        run: |
          jq '.build.beforeBuildCommand = "npm run build && cd go-service && bash build.sh"' src-tauri/tauri.conf.json > src-tauri/tauri.ci.conf.json

      - name: Build Go service (bash)
        run: |
          cd go-service
          bash build.sh

      - name: Build Tauri (dmg+app)
        env:
          TAURI_CONFIG: ${{ github.workspace }}/src-tauri/tauri.ci.conf.json
        run: |
          pnpm tauri build -- --bundles app,dmg --target aarch64-apple-darwin --ci

      - name: Zip .app for upload
        run: |
          APP_DIR=$(ls -d src-tauri/target/**/bundle/macos/*.app | head -n 1)
          if [ -n "$APP_DIR" ]; then ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" macos-arm64.app.zip; fi

      - name: Upload artifacts (DMG)
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: |
            src-tauri/target/**/bundle/macos/*.dmg
          if-no-files-found: ignore

      - name: Upload artifacts (APP zip)
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-app
          path: |
            macos-arm64.app.zip
          if-no-files-found: ignore

  macos-x64:
    name: macos-x64
    runs-on: macos-13
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust (x86_64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Build frontend (vite)
        run: pnpm run build

      - name: Patch tauri.conf.json beforeBuildCommand to use build.sh
        run: |
          jq '.build.beforeBuildCommand = "npm run build && cd go-service && bash build.sh"' src-tauri/tauri.conf.json > src-tauri/tauri.ci.conf.json

      - name: Build Go service (bash)
        run: |
          cd go-service
          bash build.sh

      - name: Build Tauri (dmg+app)
        env:
          TAURI_CONFIG: ${{ github.workspace }}/src-tauri/tauri.ci.conf.json
        run: |
          pnpm tauri build -- --bundles app,dmg --target x86_64-apple-darwin --ci

      - name: Zip .app for upload
        run: |
          APP_DIR=$(ls -d src-tauri/target/**/bundle/macos/*.app | head -n 1)
          if [ -n "$APP_DIR" ]; then ditto -c -k --sequesterRsrc --keepParent "$APP_DIR" macos-x64.app.zip; fi

      - name: Upload artifacts (DMG)
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-dmg
          path: |
            src-tauri/target/**/bundle/macos/*.dmg
          if-no-files-found: ignore

      - name: Upload artifacts (APP zip)
        uses: actions/upload-artifact@v4
        with:
          name: macos-x64-app
          path: |
            macos-x64.app.zip
          if-no-files-found: ignore

  macos-universal:
    name: macos-universal
    runs-on: macos-14
    needs: [macos-arm64, macos-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download macOS arm64 APP
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64-app
          path: artifacts/macos-arm64

      - name: Download macOS x64 APP
        uses: actions/download-artifact@v4
        with:
          name: macos-x64-app
          path: artifacts/macos-x64

      - name: Unzip apps
        run: |
          mkdir -p work
          unzip -q artifacts/macos-arm64/*.zip -d work/arm64
          unzip -q artifacts/macos-x64/*.zip -d work/x64

      - name: Create Universal .app and DMG
        run: |
          ARM_APP=$(ls -d work/arm64/*.app | head -n 1)
          X64_APP=$(ls -d work/x64/*.app | head -n 1)
          [ -z "$ARM_APP" -o -z "$X64_APP" ] && echo "Apps not found" && exit 1
          cp -R "$ARM_APP" work/universal.app
          BIN_NAME=$(basename "$(ls work/universal.app/Contents/MacOS/* | head -n 1)")
          lipo -create \
            "$ARM_APP/Contents/MacOS/$BIN_NAME" \
            "$X64_APP/Contents/MacOS/$BIN_NAME" \
            -output work/universal.app/Contents/MacOS/$BIN_NAME
          chmod +x work/universal.app/Contents/MacOS/$BIN_NAME
          GO_REL=Contents/Resources/binaries/ipaget-service
          if [ -f "$ARM_APP/$GO_REL" ] && [ -f "$X64_APP/$GO_REL" ]; then
            lipo -create "$ARM_APP/$GO_REL" "$X64_APP/$GO_REL" -output work/universal.app/$GO_REL
            chmod +x work/universal.app/$GO_REL
          fi
          hdiutil create -volname iPAGet -srcfolder work/universal.app -ov -format UDZO universal-macOS-Universal.dmg

      - name: Upload Universal DMG
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal-dmg
          path: universal-macOS-Universal.dmg

  release:
    name: release-draft
    runs-on: ubuntu-latest
    needs: [windows, linux-amd64, macos-arm64, macos-x64, macos-universal]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts from this run
        uses: actions/download-artifact@v4
        with:
          path: dist-release

      - name: List downloaded artifacts
        run: |
          echo "Downloaded files:" && ls -R dist-release || true

      - name: Create GitHub Release (draft) and upload assets
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist-release/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


