<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iPAGet - iOS App Manager</title>
    <style>
      :root {
        --bg-from: #0f172a;
        --bg-to: #1e293b;
        --accent: #6366f1;
        --accent-light: #818cf8;
        --text-muted: #94a3b8;
      }

      body {
        margin: 0;
        padding: 0;
        background: var(--bg-from);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }

      #app-loader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 30%, #1e293b 0%, #0f172a 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      
      #app-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }
      
      /* Titlebar Area */
      #loader-titlebar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 32px;
        display: flex;
        justify-content: flex-end;
        padding: 4px 8px;
        z-index: 10000;
        -webkit-app-region: drag;
      }
      
      .window-controls {
        display: flex;
        gap: 4px;
        -webkit-app-region: no-drag;
      }
      
      .control-btn {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        border: none;
        color: var(--text-muted);
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      
      .control-btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
      }
      
      .control-btn.close:hover {
        background: #ef4444;
        color: white;
      }
      
      .control-btn svg {
        width: 12px;
        height: 12px;
      }
      
      /* Main Content */
      .loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        position: relative;
        z-index: 1;
        transform: translateY(-10px);
      }
      
      .logo-wrapper {
        position: relative;
        width: 96px;
        height: 96px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
      }
      
      .logo-glow {
        position: absolute;
        inset: -20px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, transparent 70%);
        animation: pulse-glow 3s ease-in-out infinite;
        border-radius: 50%;
        filter: blur(10px);
      }
      
      .logo-img {
        position: relative;
        width: 100%;
        height: 100%;
        object-fit: contain;
        filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.4));
        animation: breathe 3s ease-in-out infinite;
        z-index: 2;
      }
      
      .progress-container {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
        margin-bottom: 16px;
      }
      
      .progress-bar {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        background: linear-gradient(90deg, transparent, var(--accent), var(--accent-light), var(--accent), transparent);
        animation: shimmer 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        border-radius: 2px;
      }
      
      .status-text {
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: var(--text-muted);
        opacity: 0.8;
      }

      /* Animations */
      @keyframes pulse-glow {
        0%, 100% { opacity: 0.3; transform: scale(0.8); }
        50% { opacity: 0.6; transform: scale(1.1); }
      }
      
      @keyframes breathe {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6px); }
      }
      
      @keyframes shimmer {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(300%); }
      }
    </style>
  </head>
  <body>
    <script>
      // Only show loader for main window, not for debug/installer windows
      const isSpecialWindow = window.location.pathname === '/debug' || window.location.pathname === '/installer';
      if (!isSpecialWindow) {
        // Detect language from browser or localStorage
        const savedLang = localStorage.getItem('i18nextLng');
        const browserLang = navigator.language || navigator.userLanguage;
        const lang = savedLang || (browserLang.startsWith('zh') ? 'zh' : 'en');
        
        const texts = {
          en: {
            loading: 'Loading iPAGet...',
            initializing: 'Initializing...'
          },
          zh: {
            loading: '加载 iPAGet 中...',
            initializing: '初始化中...'
          }
        };
        
        const t = texts[lang] || texts.en;
        
        document.write(`
          <div id="loader-titlebar">
            <div class="window-controls">
              <button class="control-btn minimize" id="loader-minimize" title="Minimize">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
              </button>
              <button class="control-btn close" id="loader-close" title="Close">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
          
          <div id="app-loader">
            <div class="loader-content">
              <div class="logo-wrapper">
                <div class="logo-glow"></div>
                <img src="/app-icon.png" class="logo-img" alt="iPAGet" />
              </div>
              
              <div class="progress-container">
                <div class="progress-bar"></div>
              </div>
              
              <div class="status-text" id="loader-status">${t.initializing}</div>
            </div>
          </div>
        `);
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Window controls for loader
      (function() {
        const loaderMinimize = document.getElementById('loader-minimize');
        const loaderClose = document.getElementById('loader-close');
        
        function initWindowControls() {
          if (window.__TAURI__ && window.__TAURI__.window) {
            const { getCurrent } = window.__TAURI__.window;
            const appWindow = getCurrent();
            
            if (loaderMinimize) {
              loaderMinimize.addEventListener('click', () => {
                appWindow.minimize();
              });
            }
            
            if (loaderClose) {
              loaderClose.addEventListener('click', () => {
                appWindow.close();
              });
            }
          } else {
            // Retry after a short delay if Tauri is not ready
            setTimeout(initWindowControls, 100);
          }
        }
        
        // Initialize window controls when DOM is ready
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', initWindowControls);
        } else {
          initWindowControls();
        }
      })();
    </script>
  </body>
</html>
